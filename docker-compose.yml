services:
  mysql:
    image: mysql:8.4
    container_name: franquicias-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el archivo .env}
      MYSQL_DATABASE: franquicias_db
      MYSQL_USER: franquicias_app
      MYSQL_PASSWORD: ${MYSQL_FRANQUICIAS_APP_PASSWORD:?Define MYSQL_FRANQUICIAS_APP_PASSWORD en el archivo .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
